<text x="40" y="642" class="k">04 · TOKEN TAX SKETCH</text>
<text x="40" y="662" class="tiny">surface chunks = flat visible units; structure groups = 3×3 capacity-based blocks. token tax saved = surface − groups; Δ = groups − surface.</text>
<rect x="40" y="690" width="210" height="76" rx="14" fill="#ffffff" stroke="#e3dfd6"/>
<text x="58" y="718" class="tiny">surface chunks</text>
<text x="58" y="748" class="h">8</text>
