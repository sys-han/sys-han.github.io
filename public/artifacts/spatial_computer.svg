<text x="40" y="304" class="k">02 · SPATIAL BLOCK LAYOUT</text>
<text x="40" y="326" class="tiny">Each block uses the same 3×3 canvas. English fills it with letters; Korean fills it with jamo, the alphabet-like pieces inside Hangul syllables.</text>
