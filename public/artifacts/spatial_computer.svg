<text x="40" y="524" class="k">03 · LETTERFORM-REMOVED COLOR VIEW</text>
<text x="40" y="546" class="tiny">Fill colors replace letterforms. Bottom bars mark chat cues built for colloquial written language: reaction, emphasis, and shorthand.</text>
